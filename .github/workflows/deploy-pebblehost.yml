name: Deploy to Pebblehost via SFTP

on:
  push:
    branches:
      - main
      - master
    paths:
      - "projects/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The bot's .env (Discord IDs, Supabase, Redis) lives only on Pebblehost and
      # is never uploaded from here. Several of the matching GitHub secrets are
      # empty, so generating it here would overwrite the working config.

      # The bot host is blocked by statsapi.mlb.com, so /remember reads a bundled
      # snapshot. Refresh the current and previous season here before upload;
      # if the runner can't reach the API either, the committed data ships as-is.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh /remember season data
        continue-on-error: true
        working-directory: projects/phillies-bot
        run: |
          pip install -q MLB-StatsAPI curl_cffi
          YEAR=$(date +%Y)
          python scripts/build_remember_data.py $((YEAR - 1)) "$YEAR"

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.PEBBLEHOST_SFTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::PEBBLEHOST_SFTP_PASSWORD secret is empty"
            exit 1
          fi
          # --env-password reads LFTP_PASSWORD, so the password never has to be
          # quoted into the command. No --delete, and runtime files are
          # excluded, so .env and the bot's saved state on the host are never
          # overwritten or removed.
          lftp -c "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:timeout 30;
            set net:max-retries 3;
            open --env-password -u 'paul.t.boye@gmail.com.da213d9e' sftp://na1660.pebblehost.net:2222;
            mirror --reverse --verbose \
              --exclude-glob .env \
              --exclude-glob __pycache__/ \
              --exclude-glob '*.tmp' \
              --exclude-glob data/state.json \
              --exclude-glob data/state.db \
              --exclude-glob 'data/bingo*.json' \
              projects/phillies-bot/ \
              /projects/phillies-bot/;
            bye
          "
